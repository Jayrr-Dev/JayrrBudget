<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip's little moods</title><style>*{box-sizing:border-box}body{margin:0;padding:48px 24px;background:#fff7f5;color:#60353d;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto}h1{font-size:36px;margin:0 0 8px}p{color:#956a74;margin:0 0 32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}a{display:block;text-align:center;background:#fff;border:1px solid #f1dce1;border-radius:24px;padding:8px 12px 20px;color:inherit;text-decoration:none}a:hover{background:#ffedf1}img{width:100%;height:auto;display:block}span{text-transform:capitalize;font-weight:600}</style><main><h1>Pip's little moods</h1><p>Ten animated expressions. Transparent backgrounds. Scale to any size. Click a pig to open its SVG.</p><div class="grid"><a href="neutral.svg"><img src="neutral.svg" alt="neutral pig"><span>neutral</span></a><a href="happy.svg"><img src="happy.svg" alt="happy pig"><span>happy</span></a><a href="sad.svg"><img src="sad.svg" alt="sad pig"><span>sad</span></a><a href="angry.svg"><img src="angry.svg" alt="angry pig"><span>angry</span></a><a href="surprised.svg"><img src="surprised.svg" alt="surprised pig"><span>surprised</span></a><a href="sleepy.svg"><img src="sleepy.svg" alt="sleepy pig"><span>sleepy</span></a><a href="love.svg"><img src="love.svg" alt="love pig"><span>love</span></a><a href="confused.svg"><img src="confused.svg" alt="confused pig"><span>confused</span></a><a href="excited.svg"><img src="excited.svg" alt="excited pig"><span>excited</span></a><a href="thinking.svg"><img src="thinking.svg" alt="thinking pig"><span>thinking</span></a></div></main></html>
