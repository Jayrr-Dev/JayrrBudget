      <path d="M107 171C127 148 154 137 181 135" stroke="#FFE5E8" stroke-width="9"/>
<g class="eyes"><g fill="#60353D" stroke="none"><ellipse cx="146" cy="212" rx="11" ry="15"/><ellipse cx="254" cy="212" rx="11" ry="15"/><circle cx="149" cy="207" r="3.5" fill="#FFF5F3"/><circle cx="257" cy="207" r="3.5" fill="#FFF5F3"/></g><path d="M128 178L160 190M240 190L272 178" /></g>      <g fill="#EF94AF" stroke="none" opacity=".65">
