<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" role="img" aria-labelledby="title desc"><title id="title">Angry pig</title><desc id="desc">Animated pink pig head with a angry expression. Transparent, scalable vector artwork.</desc><style> .pig{transform-origin:200px 240px;animation:var(--motion) 3s ease-in-out infinite}.eyes{transform-origin:200px 212px;animation:blink 5.6s infinite}.accent{animation:float 3s ease-in-out infinite}.tear{animation:teardrop 2.8s ease-in infinite}@keyframes breathe{50%{transform:translateY(-3px)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}@keyframes huff{0%,100%{transform:translateY(1px)}50%{transform:translateY(-3px) scale(1.025)}}@keyframes sleep{50%{transform:translateY(4px) rotate(2deg)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes float{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-8px);opacity:1}}@keyframes teardrop{0%{transform:translateY(0);opacity:0}20%{opacity:1}85%,100%{transform:translateY(30px);opacity:0}}@media(prefers-reduced-motion:reduce){.pig,.eyes,.accent,.tear{animation:none}}</style><g stroke="#60353D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><g class="pig" style="--motion:huff">      <!-- Soft triangular ears with rounded tips. -->
