<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pip the thinking pig</title>
  <desc id="desc">A cute pink pig tilts its head, blinks, and holds a little hoof to its cheek while question marks float overhead. Transparent background and infinitely scalable vector artwork.</desc>
  <style>
    .pig { transform-origin: 200px 240px; animation: ponder 4s ease-in-out infinite; }
    .eyes { transform-origin: 200px 213px; animation: blink 5.6s infinite; }
    .question { animation: float 3s ease-in-out infinite; }
    .question.small { animation-delay: -.9s; }
    @keyframes ponder { 0%,100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-4px); } }
    @keyframes blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(-9px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pig,.eyes,.question { animation: none; } }
  </style>
  <!-- All details are vector paths; no fonts, raster images, or external dependencies. -->
  <g stroke="#60353D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g class="question" stroke="#AA718B" stroke-width="8">
      <path d="M268 48C269 27 302 25 305 44C308 60 286 60 285 75"/>
      <path d="M284 90V91"/>
    </g>
    <g class="question small" stroke="#D49AAF" stroke-width="6">
      <path d="M331 78C333 65 353 66 354 78C355 89 342 89 340 98"/>
      <path d="M338 110V111"/>
    </g>
    <g class="pig">
      <!-- Soft triangular ears with rounded tips. -->
      <path d="M91 163C72 137 62 89 79 84C98 77 137 104 149 130" fill="#F6B5C0"/>
      <path d="M97 140C88 122 84 108 88 103C103 105 118 117 124 127" fill="#E78EAA" stroke="none"/>
      <path d="M249 130C266 105 302 79 317 89C332 101 320 149 304 166" fill="#F6B5C0"/>
      <path d="M275 128C285 115 300 105 307 107C310 116 305 133 299 145" fill="#E78EAA" stroke="none"/>
      <!-- Main head. -->
      <path d="M201 114C121 111 65 160 65 226C65 295 121 335 201 335C280 335 335 291 335 226C335 159 279 115 201 114Z" fill="#F8C3CC"/>
      <path d="M88 267C110 302 151 316 202 316C254 316 297 299 319 268C302 310 256 335 201 335C149 335 106 316 88 267Z" fill="#ECA5B7" stroke="none"/>
      <path d="M107 171C127 148 154 137 181 135" stroke="#FFE5E8" stroke-width="9"/>
      <!-- One eyebrow lifted, eyes glancing toward the questions. -->
      <path d="M127 185Q141 176 154 184" stroke-width="5"/>
      <path d="M239 174Q254 162 269 174" stroke-width="5"/>
      <g class="eyes" stroke="none" fill="#60353D">
        <ellipse cx="146" cy="212" rx="11" ry="15"/>
        <ellipse cx="258" cy="209" rx="11" ry="15"/>
        <circle cx="150" cy="207" r="3.6" fill="#FFF5F3"/>
        <circle cx="262" cy="204" r="3.6" fill="#FFF5F3"/>
      </g>
      <g fill="#EF94AF" stroke="none" opacity=".65">
        <ellipse cx="112" cy="242" rx="20" ry="12" transform="rotate(12 112 242)"/>
        <ellipse cx="287" cy="239" rx="20" ry="12" transform="rotate(-12 287 239)"/>
      </g>
      <!-- Squishy snout and tiny contemplative mouth. -->
      <ellipse cx="200" cy="251" rx="47" ry="32" fill="#F09DAF" stroke-width="5"/>
      <path d="M174 234Q187 227 200 229" stroke="#FFD6DF" stroke-width="5"/>
      <ellipse cx="183" cy="251" rx="6" ry="8" fill="#854653" stroke="none"/>
      <ellipse cx="217" cy="251" rx="6" ry="8" fill="#854653" stroke="none"/>
      <path d="M193 299Q202 293 211 297" stroke-width="5"/>
      <!-- Little cloven hoof held against the cheek: the thinking pose. -->
      <path d="M248 323C244 311 237 298 237 288C237 277 245 272 252 277C253 265 264 262 270 269C278 263 288 269 286 281C287 295 280 313 270 325" fill="#F6B5C0" stroke-width="5"/>
      <path d="M252 278L255 288M270 271L269 284" stroke-width="4"/>
      <path d="M249 315Q260 319 276 310L270 325Q261 331 248 323Z" fill="#AD7384" stroke-width="4"/>
    </g>
  </g>
</svg>
