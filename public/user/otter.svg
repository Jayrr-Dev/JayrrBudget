<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Otter</title>
  <desc id="desc">Animated brown otter in a dark suit, white shirt, and red tie, with a light muzzle and whiskers.</desc>
  <style>
    .otter{transform-origin:64px 128px;animation:bob 3.4s ease-in-out infinite}
    .head{transform-origin:64px 94px;animation:tilt 3.4s ease-in-out infinite}
    .ear-l{transform-origin:32px 40px;animation:ear 3.4s ease-in-out infinite}
    .ear-r{transform-origin:96px 40px;animation:ear 3.4s ease-in-out infinite reverse}
    .eyes{transform-origin:64px 54px;animation:blink 5.4s infinite}
    .whiskers{transform-origin:64px 68px;animation:twitch 6.8s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
    @keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
    @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
    @keyframes twitch{0%,86%,100%{transform:translateY(0)}90%{transform:translateY(-1.5px)}94%{transform:translateY(.5px)}}
    @media(prefers-reduced-motion:reduce){.otter,.head,.ear-l,.ear-r,.eyes,.whiskers{animation:none}}
  </style>
  <g class="otter" stroke="#60353d" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5">
    <!-- Shirt, suit, tie. -->
    <path fill="#f6f2e6" d="M38 94h52l-26 34Z"/>
    <path fill="#2b2b38" d="M8 132c4-24 18-36 38-40l18 28-4 12Z"/>
    <path fill="#2b2b38" d="M120 132c-4-24-18-36-38-40l-18 28 4 12Z"/>
    <path fill="#c8352e" d="M64 104l-6 6 4 14 2 8 2-8 4-14Z"/>
    <path fill="#a82a25" d="M57 97h14l-2 8h-10Z"/>
    <g class="head">
      <!-- Ears. -->
      <g class="ear-l">
        <circle cx="32" cy="34" r="10" fill="#a5744a"/>
        <circle cx="32" cy="35" r="5" fill="#d9b48c" stroke="none"/>
      </g>
      <g class="ear-r">
        <circle cx="96" cy="34" r="10" fill="#a5744a"/>
        <circle cx="96" cy="35" r="5" fill="#d9b48c" stroke="none"/>
      </g>
      <!-- Head. -->
      <path fill="#a5744a" d="M64 24C40 24 24 40 24 62c0 20 16 32 40 32s40-12 40-32C104 40 88 24 64 24Z"/>
      <path fill="#8b5e3a" stroke="none" d="M28 74c8 14 20 20 36 20s28-6 36-20c-6 14-18 20-36 20-16 0-28-6-36-20Z"/>
      <path stroke="#c9a075" stroke-width="5" d="M40 38q10-9 22-9"/>
      <!-- Muzzle. -->
      <path fill="#ead6ba" stroke="none" d="M64 52c-19 0-32 8-32 19 0 12 14 21 32 21s32-9 32-21c0-11-13-19-32-19Z"/>
      <!-- Eyes. -->
      <g class="eyes" fill="#3a2a30" stroke="none">
        <ellipse cx="48" cy="54" rx="5" ry="6"/>
        <ellipse cx="80" cy="54" rx="5" ry="6"/>
        <circle cx="50" cy="52" r="1.6" fill="#fff5f3"/>
        <circle cx="82" cy="52" r="1.6" fill="#fff5f3"/>
      </g>
      <!-- Nose, mouth, whiskers. -->
      <g class="whiskers">
        <path fill="#3a2a30" stroke="none" d="M57 64c0-4 3-6 7-6s7 2 7 6c0 3-3 6-7 6s-7-3-7-6Z"/>
        <path stroke-width="3" d="M64 70v3M57 76q7 5 14 0"/>
        <path stroke-width="2.5" d="M40 66l-14-3M40 71l-14 2M88 66l14-3M88 71l14 2"/>
      </g>
    </g>
  </g>
</svg>
